.icon {fill:none;stroke:#d4c1ff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
</style><g id="bt" class="icon"><path d="M10 1v22l9-7L3 5m0 14L19 8 10 1"/></g></defs>
