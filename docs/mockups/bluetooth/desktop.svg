<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="1140" viewBox="0 0 1560 1140">
<title>Pearl Bluetooth settings and flyout proposal</title>
<desc>Dark theme mockup with adapter power, connected and paired devices, explicit discovery, and a compact Bluetooth flyout. All device data is illustrative.</desc>
<defs><style>
text {font-family:'DejaVu Sans',sans-serif;font-size:14px;fill:#eee9f3}
