<svg xmlns='http://www.w3.org/2000/svg' width='1200' height='1120' viewBox='0 0 1200 1120' role='img' aria-labelledby='title desc'><title id='title'>Assistant settings layout — comparison</title><desc id='desc'>Static design proposal using Pearl settings cards, summary disclosures, native control styling and a persistent shared draft footer. Sample states and data are illustrative.</desc>
