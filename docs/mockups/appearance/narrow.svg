<svg xmlns='http://www.w3.org/2000/svg' width='390' height='1000' viewBox='0 0 390 1000' role='img' aria-labelledby='title desc'>
<title id='title'>Pearl Appearance redesign — narrow window</title><desc id='desc'>Static proposed settings layout with shared navigation, draft preview, visual theme choices, grouped controls and a persistent Apply and save footer.</desc>
