<svg xmlns='http://www.w3.org/2000/svg' width='1280' height='1120' viewBox='0 0 1280 1120' role='img' aria-labelledby='title desc'>
<title id='title'>Pearl Appearance redesign — additional settings</title><desc id='desc'>Static proposed settings layout with shared navigation, draft preview, visual theme choices, grouped controls and a persistent Apply and save footer.</desc>
