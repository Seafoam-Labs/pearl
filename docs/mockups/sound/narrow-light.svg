<svg xmlns="http://www.w3.org/2000/svg" width="440" height="1130" viewBox="0 0 440 1130">
<title>Pearl Sound — compact light proposal</title>
<desc>Static 440-pixel-wide light-theme proposal showing vertically reflowed Sound controls. This is a tall content preview; the body scrolls in shorter windows. Device selection changes the default. Other devices expands individual volume and mute controls. Each active stream has a mute toggle, slider, percentage and menu with Move to default. The muted input retains its volume and has an explicit Muted label. The application list contains one playback and one recording stream. No microphone level metering is claimed. Device names and stream data are illustrative.</desc>
<defs><style>
text{font-family:'DejaVu Sans',sans-serif;font-size:14px;fill:#28232e}.secondary{fill:#696171;font-size:12px}.section{font-size:17px;font-weight:600}.icon{fill:none;stroke:#6b4d94;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.line{stroke:#e1dbe8}.track{stroke:#ddd4e9;stroke-width:6;stroke-linecap:round}.fill{stroke:#76549e;stroke-width:6;stroke-linecap:round}.button{fill:#eee7f5}
</style>
<g id="speaker" class="icon"><path d="M2 9h5l6-5v16l-6-5H2Z M17 8q4 4 0 8 M20 4q8 8 0 16"/></g>
<g id="mic" class="icon"><rect x="8" y="2" width="8" height="13" rx="4"/><path d="M4 11v2a8 8 0 0 0 16 0v-2 M12 21v3 M8 24h8"/></g>
<g id="more" fill="#696171"><circle cx="6" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="18" cy="12" r="1.6"/></g>
