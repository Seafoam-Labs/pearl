<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="1040" viewBox="0 0 1160 1040">
<title>Pearl Settings — Sound proposal</title>
<desc>Static design proposal with illustrative devices and streams. Output and Input each show the default device, a device selector that sets the default, volume, and a mute toggle. Other devices expands to independent device volume and mute controls without changing the default. Application rows remain separate streams, show their observed route, and expose Move to default in the overflow menu. Changing the default does not implicitly move existing streams. Sliders range from 0 to 100 percent. Muting preserves the slider value. Names wrap in implementation. No input level meter or speaker test is implied. Production code is unchanged.</desc>
