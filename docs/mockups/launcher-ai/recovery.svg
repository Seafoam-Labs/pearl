<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1040" viewBox="0 0 1440 1040">
<title>Pearl assistant narrow window and recovery states</title><desc>A narrow chat window asks the user to finish setup without losing their question. Adjacent cards show download progress, provider failure with partial results, low memory and a stopped response.</desc>
<rect width="1440" height="1040" fill="#17131d"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="64" y="43" fill="#c9aceb" font-size="12" letter-spacing="2">PEARL / ASSISTANT</text><text x="64" y="85" fill="#f4edf8" font-size="29">Keep the question. Make the next step clear.</text><text x="1376" y="43" fill="#bfb0cd" font-size="12" text-anchor="end">05 / Narrow layout and recovery</text>
<text x="64" y="145" fill="#bfb0cd" font-size="13">320 px minimum width · Shown enlarged</text>
<rect x="64" y="171" width="416" height="730" rx="17" fill="#28212f" stroke="#9a7db0"/><path d="M81 171H463Q480 171 480 188V257H64V188Q64 171 81 171Z" fill="#302537"/>
<text x="85" y="204" fill="#f4edf8" font-size="17">Pearl Assistant</text><text x="390" y="205" fill="#cbb8d9" font-size="16">⋯  −  ×</text><text x="85" y="236" fill="#bdadc9" font-size="12">Setup needed</text>
<rect x="108" y="278" width="350" height="88" rx="12" fill="#473253"/><g fill="#f1e4fb" font-size="15"><text x="124" y="307">What is the difference between</text><text x="124" y="333">RAM and storage?</text></g>
<text x="85" y="411" fill="#f4edf8" font-size="19">One more step</text><g fill="#c7b9d5" font-size="14"><text x="85" y="444">Choose a search engine before</text><text x="85" y="469">Pearl can look this up.</text></g>
<rect x="85" y="496" width="373" height="91" rx="12" fill="#211b27"/><text x="102" y="527" fill="#b9dcbc" font-size="13">✓ Local model ready</text><text x="102" y="558" fill="#e4c895" font-size="13">○ No search engine configured</text>
<rect x="85" y="608" width="373" height="43" rx="10" fill="#c9aceb"/><text x="271" y="636" fill="#30203d" font-size="14" text-anchor="middle">Open Assistant settings</text><rect x="85" y="663" width="373" height="39" rx="10" fill="#42314e"/><text x="271" y="688" fill="#e6d6f2" font-size="13" text-anchor="middle">Retry this question</text>
<g fill="#b9a7c6" font-size="12"><text x="85" y="737">Your question stays here while you</text><text x="85" y="759">finish setup. Nothing has been sent.</text></g><path d="M64 783H480" stroke="#51405c"/>
<rect x="85" y="800" width="373" height="56" rx="10" fill="#211b27"/><text x="100" y="832" fill="#8f7d9d" font-size="13">Finish setup to continue</text><text x="85" y="880" fill="#b4a0c2" font-size="11">Answers on device · Web search online</text>

<text x="535" y="145" fill="#bfb0cd" font-size="13">Companion states · Each appears in its relevant settings or chat view</text>
<rect x="535" y="171" width="841" height="158" rx="15" fill="#2d2534" stroke="#51405c"/><text x="558" y="204" fill="#d4b8ed" font-size="11" letter-spacing="1.2">MODEL DOWNLOAD</text><text x="558" y="235" fill="#f4edf8" font-size="17">Downloading LFM2.5-350M</text><text x="558" y="262" fill="#c0aecf" font-size="13">115 of 229 MB · You can continue using the launcher.</text><rect x="558" y="285" width="638" height="7" rx="4" fill="#493a55"/><rect x="558" y="285" width="320" height="7" rx="4" fill="#c9aceb"/><text x="1269" y="292" fill="#d7bcef" font-size="13">Cancel</text>

<rect x="535" y="349" width="841" height="190" rx="15" fill="#2d2534" stroke="#51405c"/><text x="558" y="382" fill="#e4c895" font-size="11" letter-spacing="1.2">PARTIAL SEARCH RESULTS</text><text x="558" y="414" fill="#f4edf8" font-size="17">Brave has reached its request limit</text><text x="558" y="442" fill="#c0aecf" font-size="13">Your selected SearXNG engine returned 4 results. The answer uses those sources.</text><text x="558" y="467" fill="#c0aecf" font-size="13">No other engine was contacted. You can inspect the results or try again later.</text><rect x="558" y="484" width="137" height="34" rx="9" fill="#534067"/><text x="626" y="506" fill="#f2e5fb" font-size="12" text-anchor="middle">View 4 results</text><text x="723" y="506" fill="#d7bcef" font-size="12">Search settings →</text>

<rect x="535" y="559" width="841" height="157" rx="15" fill="#2d2534" stroke="#51405c"/><text x="558" y="592" fill="#e4c895" font-size="11" letter-spacing="1.2">MEMORY PRESSURE</text><text x="558" y="624" fill="#f4edf8" font-size="17">Not enough memory to generate an answer</text><text x="558" y="652" fill="#c0aecf" font-size="13">Search results are still available. Close another app, then retry.</text><rect x="558" y="672" width="88" height="29" rx="8" fill="#534067"/><text x="602" y="692" fill="#f2e5fb" font-size="12" text-anchor="middle">Retry</text><text x="676" y="692" fill="#d7bcef" font-size="12">View search results →</text>

<rect x="535" y="736" width="841" height="165" rx="15" fill="#2d2534" stroke="#51405c"/><text x="558" y="769" fill="#d4b8ed" font-size="11" letter-spacing="1.2">STOPPED BY YOU</text><text x="558" y="801" fill="#f4edf8" font-size="17">Response stopped</text><text x="558" y="829" fill="#c0aecf" font-size="13">Partial text and source links stay visible. No tool calls are still running.</text><rect x="558" y="849" width="132" height="32" rx="9" fill="#534067"/><text x="624" y="871" fill="#f2e5fb" font-size="12" text-anchor="middle">Try again</text><text x="720" y="871" fill="#d7bcef" font-size="12">Ask a different question below</text>
<text x="64" y="954" fill="#d5c1e2" font-size="14">Close cancels and hides. Resume restores session text. Disabling the assistant stops everything and clears conversations.</text>
<text x="64" y="1007" fill="#a99ab6" font-size="12">Static design states · No live requests, downloads, model execution or credentials</text>
</g></svg>
