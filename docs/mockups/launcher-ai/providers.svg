<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1040" viewBox="0 0 1440 1040">
<title>Pearl configured search engine settings</title><desc>Search engine settings show Brave as default, SearXNG disabled, default-only or all-enabled modes, and a SearXNG editor with endpoint, engine choices and explicit connection test.</desc>
<rect width="1440" height="1040" fill="#17131d"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="64" y="43" fill="#c9aceb" font-size="12" letter-spacing="2">PEARL / ASSISTANT</text><text x="64" y="85" fill="#f4edf8" font-size="29">Search the services you configure</text><text x="1376" y="43" fill="#bfb0cd" font-size="12" text-anchor="end">03 / Search engines</text>
<rect x="64" y="118" width="1312" height="846" rx="20" fill="#27212e" stroke="#55465f"/>
<path d="M84 118H1356Q1376 118 1376 138V168H64V138Q64 118 84 118Z" fill="#211b27"/><circle cx="92" cy="143" r="8" fill="#dac5ee"/><text x="112" y="148" fill="#f4edf8" font-size="14">Pearl Settings</text><text x="1258" y="149" fill="#bfafcd" font-size="18">−    □    ×</text>
<text x="104" y="222" fill="#f4edf8" font-size="27">Assistant</text><text x="104" y="252" fill="#bdadc9" font-size="14">Choose where web questions go.</text>
<g font-size="13" fill="#c7b9d5"><text x="104" y="300">General</text><text x="208" y="300">Models</text><rect x="295" y="277" width="146" height="35" rx="9" fill="#543b70"/><text x="311" y="300" fill="#f2e5fb">Search engines</text></g>
<text x="104" y="355" fill="#f4edf8" font-size="18">Configured engines</text><rect x="471" y="332" width="162" height="34" rx="9" fill="#c9aceb"/><text x="552" y="355" fill="#30203d" font-size="12" text-anchor="middle">＋ Add search engine</text>
<rect x="104" y="386" width="529" height="111" rx="13" fill="#33293c" stroke="#665079"/><text x="126" y="418" fill="#f4edf8" font-size="16">Brave Search</text><rect x="259" y="400" width="70" height="24" rx="8" fill="#57406f"/><text x="294" y="416" fill="#e9d6fb" font-size="10" text-anchor="middle">Default</text><text x="126" y="446" fill="#b9dcbc" font-size="12">✓ Connection tested · Key saved</text><text x="126" y="474" fill="#c9aceb" font-size="12">Edit                  Test again</text><rect x="560" y="411" width="48" height="27" rx="14" fill="#c9aceb"/><circle cx="594" cy="424" r="10" fill="#352442"/>
<rect x="104" y="513" width="529" height="111" rx="13" fill="#2c2533" stroke="#4b3d55"/><text x="126" y="546" fill="#f4edf8" font-size="16">My SearXNG</text><text x="126" y="574" fill="#bdadc9" font-size="12">Not enabled · Finish setup</text><text x="126" y="602" fill="#c9aceb" font-size="12">Edit                  Remove</text><rect x="560" y="538" width="48" height="27" rx="14" fill="#65556f"/><circle cx="574" cy="551" r="10" fill="#d9cce3"/>
<text x="104" y="670" fill="#f4edf8" font-size="16">Search with</text><rect x="104" y="690" width="529" height="45" rx="10" fill="#211b27"/><rect x="108" y="694" width="257" height="37" rx="8" fill="#543b70"/><text x="236" y="718" fill="#f4edf8" font-size="13" text-anchor="middle">Default engine only</text><text x="496" y="718" fill="#bbaac9" font-size="13" text-anchor="middle">All enabled engines</text>
<text x="104" y="767" fill="#bdadc9" font-size="12">Each selected engine receives your search query.</text><text x="104" y="789" fill="#bdadc9" font-size="12">Pearl never switches to an unselected engine.</text>
<path d="M674 195V868" stroke="#4c3e55"/>
<text x="714" y="222" fill="#f4edf8" font-size="22">Edit search engine</text><text x="714" y="253" fill="#bdadc9" font-size="13">SearXNG instance · Configuration draft</text>
<g fill="#d8c8e4" font-size="13"><text x="714" y="302">Name</text><text x="714" y="390">Instance URL</text><text x="714" y="500">Engines</text><text x="714" y="609">Search language</text></g>
<g fill="#211b27" stroke="#5a4866"><rect x="714" y="319" width="620" height="44" rx="9"/><rect x="714" y="407" width="620" height="44" rx="9"/><rect x="714" y="517" width="620" height="44" rx="9"/><rect x="714" y="626" width="620" height="44" rx="9"/></g>
<g fill="#f0e5f8" font-size="14"><text x="730" y="347">My SearXNG</text><text x="730" y="435">https://search.example.org</text><text x="730" y="545">Use instance defaults                                      ⌄</text><text x="730" y="654">System language · English                                  ⌄</text></g>
<text x="714" y="476" fill="#bdadc9" font-size="12">Use an instance you trust that allows JSON search results.</text><text x="714" y="585" fill="#bdadc9" font-size="12">Optional: choose a subset of the instance’s engines.</text>
<rect x="714" y="694" width="620" height="94" rx="12" fill="#33293c"/><text x="734" y="723" fill="#f0e5f8" font-size="14">Test before enabling</text><text x="734" y="748" fill="#bdadc9" font-size="12">Sends the sample query “Pearl desktop” to this instance.</text><text x="734" y="770" fill="#bdadc9" font-size="12">No request is sent while you edit these fields.</text>
<rect x="714" y="808" width="153" height="37" rx="10" fill="#534067"/><text x="790" y="833" fill="#f2e5fb" font-size="12" text-anchor="middle">Test connection</text><text x="889" y="832" fill="#e5c994" font-size="12">Not tested</text>
<path d="M64 895H1376" stroke="#4c3e55"/><text x="104" y="934" fill="#e4c895" font-size="13">Provider changes are not yet saved</text><rect x="1082" y="911" width="91" height="36" rx="10" fill="#3d3048"/><text x="1128" y="935" fill="#e9dcf3" font-size="12" text-anchor="middle">Discard</text><rect x="1185" y="911" width="149" height="36" rx="10" fill="#c9aceb"/><text x="1260" y="935" fill="#30203d" font-size="12" font-weight="bold" text-anchor="middle">Apply &amp; save</text>
<text x="64" y="1007" fill="#a99ab6" font-size="12">Example endpoints and statuses · Brave setup uses a masked API key field; keys stay outside exported preferences.</text>
</g></svg>
