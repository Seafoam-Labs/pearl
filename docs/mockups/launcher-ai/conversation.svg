<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1040" viewBox="0 0 1440 1040">
<title>Pearl launcher question and floating assistant conversation</title><desc>Two sequential states: a natural-language launcher question with Ask Pearl selected, followed by a floating chat with a sourced summary, follow-up turn, source list and composer. The window stays open when another application is focused.</desc>
<defs><radialGradient id="wall"><stop stop-color="#493755"/><stop offset="1" stop-color="#211b29"/></radialGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#c9aceb" stroke-width="1.5"/></marker></defs>
<rect width="1440" height="1040" fill="#17131d"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="64" y="43" fill="#c9aceb" font-size="12" letter-spacing="2">PEARL / ASSISTANT</text><text x="64" y="85" fill="#f4edf8" font-size="29">Ask once. Keep the conversation close.</text><text x="1376" y="43" fill="#bfb0cd" font-size="12" text-anchor="end">04 / Two sequential interaction states</text>
<rect x="64" y="118" width="1312" height="846" rx="20" fill="url(#wall)" stroke="#55465f"/>
<rect x="84" y="134" width="259" height="38" rx="15" fill="#221c29"/><circle cx="109" cy="153" r="10" fill="#d6c0eb"/><rect x="135" y="142" width="36" height="22" rx="8" fill="#634780"/><g fill="#d8c7e5" font-size="12"><text x="149" y="157">1</text><text x="190" y="157">2</text><text x="230" y="157">3</text><text x="270" y="157">4</text></g><rect x="619" y="134" width="202" height="38" rx="15" fill="#221c29"/><text x="720" y="158" fill="#d8c7e5" font-size="12" text-anchor="middle">Wednesday · 10:42</text><rect x="1201" y="134" width="154" height="38" rx="15" fill="#221c29"/><text x="1222" y="158" fill="#d8c7e5" font-size="12">Wi-Fi    ◖))    84%</text>
<text x="107" y="233" fill="#d9beeF" font-size="12" letter-spacing="1.5">1 / SUPER + SPACE</text>
<rect x="102" y="260" width="560" height="326" rx="19" fill="#28212f" stroke="#816694"/>
<text x="125" y="299" fill="#f4edf8" font-size="21">Find your next thing</text><rect x="124" y="319" width="516" height="51" rx="11" fill="#201b25" stroke="#c9aceb" stroke-width="2"/><text x="140" y="351" fill="#f4edf8" font-size="15">What is the difference between RAM and storage?</text>
<rect x="124" y="389" width="516" height="77" rx="12" fill="#543b70"/><path d="M144 413H166V429H153L147 434V429H144Z" fill="none" stroke="#dec7f5" stroke-width="2"/><text x="183" y="420" fill="#f4edf8" font-size="16">Ask Pearl</text><text x="183" y="446" fill="#dac6e9" font-size="12">Web answer · Brave Search · Enter to ask</text><text x="603" y="432" fill="#f0e1fc" font-size="22">↵</text>
<rect x="145" y="488" width="22" height="22" rx="5" fill="#7e6a8f"/><text x="183" y="499" fill="#e0d1eb" font-size="14">Resume conversation</text><text x="183" y="519" fill="#b6a5c4" font-size="11">Earlier this session</text><text x="126" y="560" fill="#bfb0cd" font-size="12">↑ ↓ to choose · Nothing is sent until you ask</text>
<path d="M672 421H719" fill="none" stroke="#c9aceb" stroke-width="2" marker-end="url(#arrow)"/>
<text x="107" y="639" fill="#f0e5f8" font-size="19">The launcher hands off the question</text><text x="107" y="673" fill="#c6b4d3" font-size="14">Enter opens chat immediately, even while the model loads.</text><text x="107" y="699" fill="#c6b4d3" font-size="14">The launcher closes after the chat accepts the request.</text>
<rect x="107" y="743" width="550" height="142" rx="15" fill="#241e2d" stroke="#4c3c58"/><text x="128" y="775" fill="#d9beef" font-size="12" letter-spacing="1.1">WHILE WORKING</text><text x="128" y="808" fill="#eadcf4" font-size="14">Preparing → Searching Brave → Reading 2 pages</text><text x="128" y="836" fill="#bfb0cd" font-size="13">Then: Writing answer…                         Stop</text><text x="128" y="864" fill="#bfb0cd" font-size="12">Activity shows tool progress, not hidden model reasoning.</text>

<text x="750" y="217" fill="#d9beef" font-size="12" letter-spacing="1.5">2 / FLOATING CONVERSATION</text>
<rect x="741" y="239" width="582" height="684" rx="18" fill="#28212f" stroke="#9a7db0"/>
<path d="M759 239H1305Q1323 239 1323 257V318H741V257Q741 239 759 239Z" fill="#302537"/>
<text x="763" y="270" fill="#f4edf8" font-size="17">Pearl Assistant</text><text x="1207" y="271" fill="#cbb8d9" font-size="17">⋯   −   ×</text><text x="763" y="299" fill="#bdadc9" font-size="12">LFM2.5-350M · Local</text><rect x="1110" y="283" width="190" height="25" rx="8" fill="#493454"/><text x="1124" y="300" fill="#dec9ee" font-size="11">Brave Search                 ⌄</text>
<rect x="801" y="337" width="498" height="63" rx="12" fill="#473253"/><g fill="#f1e4fb" font-size="14"><text x="817" y="362">What is the difference between RAM</text><text x="817" y="385">and storage?</text></g>
<text x="764" y="431" fill="#b9dcbc" font-size="11">✓ Searched Brave · Read 2 sources</text>
<g fill="#eee3f6" font-size="14"><text x="764" y="462">RAM holds the data your running apps are using.</text><text x="764" y="486">Its contents are normally lost when power is off. [1]</text><text x="764" y="522">Storage keeps files and installed apps between</text><text x="764" y="546">sessions. More storage means more room for files; [2]</text><text x="764" y="570">more RAM can help you run more apps at once.</text></g>
<rect x="763" y="591" width="536" height="58" rx="10" fill="#211b27" stroke="#4b3c57"/><text x="778" y="613" fill="#d8bcef" font-size="11">SOURCES  ⌄</text><text x="778" y="636" fill="#c8b6d5" font-size="11">[1] Memory explained   [2] Storage guide · example.org ↗</text>
<rect x="801" y="669" width="498" height="42" rx="12" fill="#473253"/><text x="817" y="696" fill="#f1e4fb" font-size="13">Will more RAM give me more space for files?</text>
<g fill="#eee3f6" font-size="13"><text x="764" y="741">No. To keep more files, you need more storage.</text><text x="764" y="764">Adding RAM changes working memory. [1][2]</text></g>
<path d="M741 787H1323" stroke="#51405c"/><rect x="762" y="805" width="538" height="65" rx="12" fill="#201a26" stroke="#6a507d"/><text x="778" y="832" fill="#ac99ba" font-size="13">Ask a follow-up…</text><rect x="1257" y="821" width="28" height="30" rx="9" fill="#c9aceb"/><text x="1271" y="842" fill="#30203d" font-size="19" text-anchor="middle">↑</text><text x="764" y="897" fill="#b4a0c2" font-size="11">Answers on device · Web search online</text>
<text x="64" y="1007" fill="#a99ab6" font-size="12">Illustrative answer and sources · Chat stays open when focus moves elsewhere · Native size: 440 × 560</text>
</g></svg>
