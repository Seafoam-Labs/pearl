<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="940" viewBox="0 0 1440 940">
<title>Pearl desktop icons concept</title><desc>A violet Pearl desktop with six sample file and application icons, a selected Projects folder, a desktop context menu, top bar islands and a bottom dock.</desc>
<defs>
 <linearGradient id="wall" x2="1" y2="1"><stop stop-color="#25213c"/><stop offset=".55" stop-color="#4d426c"/><stop offset="1" stop-color="#88789d"/></linearGradient>
 <linearGradient id="ribbon" x2=".7" y2="1"><stop stop-color="#b9a7d2" stop-opacity=".42"/><stop offset="1" stop-color="#76618e" stop-opacity=".04"/></linearGradient>
 <radialGradient id="pearl"><stop stop-color="#fff"/><stop offset=".7" stop-color="#e2d5fa"/><stop offset="1" stop-color="#ad93d5"/></radialGradient>
 <filter id="shadow" x="-30%" y="-30%" width="180%" height="180%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#100b20" flood-opacity=".35"/></filter>
 <g id="folder"><path d="M2 10Q2 5 7 5H23L29 12H57Q62 12 62 17V49Q62 55 56 55H8Q2 55 2 49Z" fill="#ab93cb"/><path d="M2 21Q2 16 8 16H56Q62 16 62 22V49Q62 55 56 55H8Q2 55 2 49Z" fill="#d2bbed"/><path d="M6 23H58" stroke="#e9d9fb" stroke-width="2"/><rect x="25" y="31" width="14" height="3" rx="1.5" fill="#8a6baa"/></g>
 <g id="document"><path d="M12 2H39L53 16V59H12Z" fill="#eee6f7"/><path d="M39 2V17H53" fill="#bc9bda"/><path d="M22 29H43M22 36H43M22 43H36" stroke="#8d79a1" stroke-width="3" stroke-linecap="round"/></g>
 <g id="browser"><rect width="60" height="60" rx="17" fill="#b1c6de"/><circle cx="30" cy="30" r="19" fill="none" stroke="#405b7d" stroke-width="3"/><ellipse cx="30" cy="30" rx="9" ry="19" fill="none" stroke="#405b7d" stroke-width="2"/><path d="M12 24H48M12 36H48" stroke="#405b7d" stroke-width="2"/></g>
 <g id="terminal"><rect width="60" height="60" rx="17" fill="#c9b6df"/><rect x="9" y="12" width="42" height="36" rx="7" fill="#4a3b5d"/><path d="M18 23L25 30L18 37M31 37H41" fill="none" stroke="#efe6f7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>
 <g id="photo"><rect x="3" y="5" width="58" height="50" rx="7" fill="#c0d7cb"/><path d="M7 48L23 28L34 39L44 26L57 48Z" fill="#668c80"/><circle cx="43" cy="18" r="5" fill="#f2e8b4"/></g>
 <g id="arrow"><rect width="17" height="17" rx="5" fill="#eee6fa"/><path d="M4 12L12 4M5 4H12V11" fill="none" stroke="#4b3b60" stroke-width="1.8"/></g>
 <clipPath id="screen"><rect x="40" y="106" width="1360" height="764" rx="24"/></clipPath>
</defs>
<rect width="1440" height="940" fill="#141119"/>
<g font-family="DejaVu Sans, sans-serif">
 <text x="40" y="34" fill="#c4aedf" font-size="11" letter-spacing="2.4">PEARL / DESKTOP ICONS</text>
 <text x="40" y="72" fill="#f3edf9" font-size="27">A place for the things you keep close.</text>
 <rect x="1120" y="34" width="280" height="34" rx="17" fill="#30263d"/><circle cx="1142" cy="51" r="4" fill="#b6dbb8"/><text x="1155" y="56" fill="#dfd3ed" font-size="12">On by default for new installs</text>
 <g clip-path="url(#screen)">
  <rect x="40" y="106" width="1360" height="764" fill="url(#wall)"/>
  <path d="M530 100C1200 110 1270 340 900 530S600 750 1120 920H1450V100Z" fill="url(#ribbon)"/>
  <path d="M900 100C1500 350 890 400 800 640S1260 910 1460 870" fill="none" stroke="#cab5e0" stroke-opacity=".14" stroke-width="75"/>
  <path d="M960 100C1500 320 930 440 860 640S1240 850 1450 850" fill="none" stroke="#ebdbf9" stroke-opacity=".10" stroke-width="2"/>
  <!-- Familiar shell islands, intentionally kept out of the icon grid. -->
  <g fill="#211c2b" stroke="#675a78" stroke-width="1">
   <rect x="56" y="120" width="226" height="46" rx="16"/><rect x="614" y="120" width="213" height="46" rx="16"/><rect x="1220" y="120" width="164" height="46" rx="16"/>
  </g>
  <circle cx="83" cy="143" r="10" fill="url(#pearl)"/><rect x="111" y="128" width="30" height="30" rx="10" fill="#695083"/>
  <g fill="#e9def7" font-size="12" text-anchor="middle"><text x="126" y="148">1</text><text x="160" y="148">2</text><text x="194" y="148">3</text><text x="228" y="148">4</text><text x="720" y="148">Wed, Oct 14 · 10:24</text></g>
  <g stroke="#ded1ef" stroke-width="1.8" fill="none" stroke-linecap="round"><path d="M1240 139H1244L1249 135V151L1244 147H1240ZM1254 138Q1260 143 1254 148M1274 140Q1283 132 1292 140M1278 144Q1283 139 1288 144"/><circle cx="1283" cy="148" r="1" fill="#ded1ef"/><rect x="1305" y="137" width="18" height="11" rx="2"/><path d="M1325 140V145M1309 140V145M1313 140V145M1317 140V145M1341 138H1363M1341 148H1363"/><circle cx="1348" cy="138" r="3" fill="#211c2b"/><circle cx="1356" cy="148" r="3" fill="#211c2b"/></g>
  <!-- Desktop sample content. -->
  <rect x="64" y="191" width="116" height="112" rx="14" fill="#cab0ee" fill-opacity=".23" stroke="#dbc4f8" stroke-opacity=".75"/>
  <use href="#folder" x="90" y="201"/><use href="#folder" x="226" y="201"/>
  <use href="#document" x="90" y="337"/><use href="#photo" x="226" y="337"/>
  <use href="#browser" x="92" y="473"/><use href="#arrow" x="88" y="518"/>
  <use href="#terminal" x="228" y="473"/><use href="#arrow" x="224" y="518"/>
  <g fill="#fbf7ff" font-size="13" text-anchor="middle">
   <text x="122" y="284">Projects</text><text x="258" y="284">Reference</text>
   <text x="122" y="421">Ideas.txt</text><text x="258" y="421">Coast.jpg</text>
   <text x="122" y="557">Web browser</text><text x="258" y="557">Terminal</text>
  </g>
  <!-- Empty-space context menu. -->
  <g filter="url(#shadow)"><rect x="363" y="364" width="280" height="259" rx="16" fill="#25202d" stroke="#71617f"/></g>
  <g fill="#eee5f6" font-size="13">
   <text x="385" y="397">New folder…</text><text x="385" y="435">Add application shortcut…</text>
   <path d="M377 454H629" stroke="#4b4056"/>
   <text x="385" y="482">Arrange by name</text><text x="385" y="520">Open Desktop folder</text>
   <path d="M377 540H629" stroke="#4b4056"/>
   <rect x="373" y="550" width="260" height="39" rx="9" fill="#59416f"/><text x="385" y="575">Desktop settings…</text>
  </g>
  <text x="385" y="608" fill="#b4a4c2" font-size="10">Desktop</text>
  <!-- Dock. -->
  <rect x="559" y="786" width="322" height="68" rx="24" fill="#241e30" stroke="#71617f"/>
  <use href="#browser" transform="translate(574 797) scale(.75)"/><use href="#folder" transform="translate(635 797) scale(.75)"/>
  <use href="#terminal" transform="translate(698 797) scale(.75)"/><use href="#photo" transform="translate(760 797) scale(.75)"/>
  <circle cx="843" cy="820" r="17" fill="url(#pearl)"/><circle cx="597" cy="846" r="2" fill="#e2d1f6"/>
 </g>
 <rect x="40" y="106" width="1360" height="764" rx="24" fill="none" stroke="#695775"/>
 <text x="40" y="909" fill="#b8a9c6" font-size="12">01 / Desktop · Selected folder and empty-space menu · 48 px icons</text>
 <text x="1400" y="909" fill="#b8a9c6" font-size="12" text-anchor="end">Static concept · Sample files</text>
</g>
</svg>
