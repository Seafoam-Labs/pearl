<svg xmlns='http://www.w3.org/2000/svg' width='390' height='1220' viewBox='0 0 390 1220' role='img' aria-labelledby='title desc'><title id='title'>System layout proposal — narrow</title><desc id='desc'>Static Pearl Settings design. Current scheduler and staged selection are separate. Runtime actions do not change boot settings. Data is illustrative.</desc>
