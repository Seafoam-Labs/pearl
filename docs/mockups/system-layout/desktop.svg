<svg xmlns='http://www.w3.org/2000/svg' width='1200' height='1000' viewBox='0 0 1200 1000' role='img' aria-labelledby='title desc'><title id='title'>System layout proposal — desktop</title><desc id='desc'>Static Pearl Settings design. Current scheduler and staged selection are separate. Runtime actions do not change boot settings. Data is illustrative.</desc>
