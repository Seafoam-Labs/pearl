function groupDirty(group){if(group==='advanced')return !same({...draft.advanced,source:''},{...baseline.advanced,source:''});return !same(draft[group],baseline[group])}
function changedGroups(){return Object.keys(pages).filter(groupDirty)}
function listChanges(group){const before=baseline[group],after=draft[group],out=[];for(const key of Object.keys(after)){if(group==='advanced'&&key==='source')continue;if(same(before[key],after[key]))continue;const label=fieldNames[group+'.'+key]||({items:'Window rules',custom:'Custom shortcuts',screens:'Display settings',raw:'Raw TOML',request:'Full draft request'}[key])||key;if(Array.isArray(after[key]))out.push(`${label}: ${after[key].length} ${key==='screens'?'screens':key==='items'?'rules':'shortcuts'} in draft`);else if(key==='raw'||key==='request')out.push(`${label}: edited text`);else out.push(`${label}: ${format(before[key])} → ${format(after[key])}`)}return out}
function format(v){return typeof v==='boolean'?(v?'On':'Off'):String(v)||'Not set'}
function optionList(options,value){return options.map(item=>{const [v,t]=Array.isArray(item)?item:[item,item];return `<option value="${esc(v)}" ${String(v)===String(value)?'selected':''}>${esc(t)}</option>`}).join('')}
function control(group,key,title,type='text',extra={}){const path=group+'.'+key,value=get(path),id='f-'+path.replaceAll('.','-');fieldNames[path]=title;const attrs=`id="${id}" data-field="${path}" ${movePending?'disabled':''}`;if(type==='toggle')return `<div class="toggle-row"><label for="${id}">${esc(title)}${extra.help?`<small>${esc(extra.help)}</small>`:''}</label><input type="checkbox" ${attrs} ${value?'checked':''}></div>`;let input=type==='select'?`<select ${attrs}>${optionList(extra.options,value)}</select>`:type==='color'?`<div class="color-control"><input type="color" ${attrs} value="${esc(value)}"><code id="${id}-value">${esc(value)}</code></div>`:`<input ${attrs} type="${type}" value="${esc(value)}" ${extra.min!==undefined?`min="${extra.min}"`:''} ${extra.max!==undefined?`max="${extra.max}"`:''} ${extra.step!==undefined?`step="${extra.step}"`:''} ${extra.required?'required':''}>`;return `<div class="row"><label for="${id}">${esc(title)}${extra.help?`<small>${esc(extra.help)}</small>`:''}</label>${input}</div>`}

function rules(){const dirty=changedGroups().length>0;return card('Window rules','All conditions must match. First matching rule wins.',draft.rules.items.map((r,i)=>`<article class="rule"><div class="ordinal">${i+1}</div><div class="rule-copy"><strong>${esc(ruleTitle(r))}</strong><p>Application ID matches “${esc(r.app)}”${r.title?`<br>Title matches “${esc(r.title)}”`:''}</p><div class="chips">${r.floating!=='Inherit'?`<span class="chip">Floating · ${r.floating}</span>`:''}${r.workspace?`<span class="chip">Workspace · ${esc(r.workspace)}</span>`:''}</div></div><div class="rule-actions"><button data-action="edit-rule" data-id="${r.id}" ${movePending?'disabled':''}>Edit</button><button data-action="move-rule" data-index="${i}" data-direction="-1" aria-label="Move rule ${i+1} earlier" ${dirty||i===0?'disabled':''}>↑</button><button data-action="move-rule" data-index="${i}" data-direction="1" aria-label="Move rule ${i+1} later" ${dirty||i===draft.rules.items.length-1?'disabled':''}>↓</button></div></article>`).join('')||'<div class="empty">No window rules. Windows use normal Aqueous behavior.</div>',`<button data-action="add-rule" ${movePending?'disabled':''}>Add rule</button>`)+`<p class="hint">${movePending?'Apply or Discard this rule move before editing other settings.':dirty?'Apply or Discard the current draft before reordering rules.':'Use the arrows to change rule order. Apply each move before making other edits.'}</p>`+details('game','Game mode','Remainder layout, fallback, and spacing',select('rules','remainder','Remainder layout',['tile','monocle','float'])+select('rules','fallback','Fallback layout',['tile','monocle','float'])+number('rules','gaps','Game inner gap',0,100))+details('rule-testing','Rule testing and source details','Ordered rules · Case-sensitive patterns',`<p>Patterns are anchored, case-sensitive globs. Aqueous currently has no authoritative window-rule tester; this mockup does not guess matches.</p><p class="hint">Removing a setting inherits nor function displays(){const g='displays',s=draft.displays.screens[selectedScreen],prefix='screens.'+selectedScreen+'.';const fields=select(g,prefix+'resolution','Resolution',selectedScreen===0?['1920 × 1200','1920 × 1080']:['2560 × 1440','1920 × 1080'])+select(g,prefix+'refresh','Refresh rate',selectedScreen===0?['60 Hz']:['144 Hz','60 Hz'])+select(g,prefix+'scale','Scale',['100%','125%','150%','200%'])+select(g,prefix+'orientation','Orientation',['Landscape','Portrait','Landscape flipped','Portrait flipped']);return card('Arrange your displays','Select a screen, then adjust its settings below.',`<div class="screen-map" id="screen-map" data-position="${draft.displays.position}" role="group" aria-label="Sample screen arrangement">${draft.displays.screens.map((screen,i)=>`<button class="screen ${selectedScreen===i?'selected':''} ${screen.enabled?'':'off'}" data-action="select-screen" data-index="${i}" aria-pressed="${selectedScreen===i}" aria-label="Select screen ${i+1}: ${screen.name}"><span class="screen-number">${i+1}</span><small>${i===0?'Built-in display':'Dell 27-inch'}</small></button>`).join('')}</div><div class="screen-selectors">${draft.displays.screens.map((screen,i)=>`<button class="${selectedScreen===i?'active':''}" data-action="select-screen" data-index="${i}" aria-pressed="${selectedScreen===i}">${i+1} · ${screen.id}</button>`).join('')}</div>`,`<button data-action="identify">Identify</button>`)+`<div class="columns">`+card(`${selectedScreen+1} · ${s.name}`,`${s.id} · ${s.enabled?'Enabled':'Disabled'}`,toggle(g,prefix+'enabled','Use this display')+`<fieldset style="border:0;padding:0;margin:16px 0 0;min-width:0" ${!s.enabled||movePending?'disabled':''}>${fields}${selectedScreen===1?toggle(g,prefix+'hdr','Enable HDR','Uses automatic brightness by default.'):'<p class="hint">HDR is not supported by this sample built-in display.</p>'}</fieldset>`)+card('Position','Place the external display relative to the built-in screen.',select(g,'position','Place display function nav(){const icons='<svg aria-hidden="true"><use href="#icon-settings"/></svg>';$('#navigation').innerHTML=`<div class="nav-group">GENERAL</div><div class="context-item">Overview</div><div class="nav-group">DESKTOP</div><div class="context-item">Appearance</div><div class="context-item">Assistant</div><div class="context-item">Bar & dock</div><div class="nav-group">SYSTEM</div><div class="context-item">System</div><div class="context-item">Session & lock</div><div class="nav-parent">${icons} Aqueous</div>${Object.entries(pages).map(([id,[title]])=>`<button class="nav-child" data-page="${id}" ${page===id?'aria-current="page"':''}>${title}<span class="dirty-dot" aria-label="Unsaved changes" ${groupDirty(id)?'':'hidden'}>●</span></button>`).join('')}<div class="nav-group" style="margin-top:18px">DESIGN REVIEW</div><div class="context-item not-live">Sample data only</div>`;}
function render(focus=false){$('#page-title').textContent=pages[page][0];$('#page-description').textContent=pages[page][1];$('#content').innerHTML=renderers[page]();nav();update();$('#body').scrollTop=scrollPositions[page]||0;if(focus)$('#page-title').focus({preventScroll:true});}

function problems(){const list=[...invalid.values()];const chords=[...shortcuts.map(([k])=>draft.keybinds[k]),...draft.keybinds.custom.map(x=>x.chord)].filter(Boolean).map(x=>x.toLowerCase().replaceAll(' ',''));if(new Set(chords).size!==chords.length)list.push('Two sample shortcuts use the same chord. Edit Keybindings to resolve the collision.');if(!draft.displays.screens.some(s=>s.enabled))list.push('Keep at least one display enabled.');if(draft.advanced.raw!==baseline.advanced.raw||draft.advanced.request!==baseline.advanced.request||draft.advanced.override!==baseline.advanced.override)list.push('Raw and request edits need canonical helper validation. This mockup retains them but cannot apply them.');return list}
function blocked(){return ['offline','conflict','unknown'].includes(scenario)||(scenario==='unavailable'&&groupDirty('displays'))||problems().length>0}
function update(){const groups=changedGroups(),dirty=groups.length>0;$('#save-status').textContent=dirty?`${groups.length} ${groups.length===1?'section has':'sections have'} unsaved changes`:feedback==='saved'?'Saved in this demo':'No unsaved changes';$('#save-status').classList.toggle('dirty',dirty);$('#save-help').textContent=dirty?groups.map(g=>pages[g][0]).join(' · '):'Aqueous changes are separate from Pearl preferences.';$('#apply').disabled=!dirty||blocked();$('#discard').disabled=!dirty;$$('.nav-child').forEach(b=>b.querySelector('.dirty-dot').hidden=!groupDirty(b.dataset.page));let message='',action='';if(scenario==='offline')message='Disconnected — your draft is retained. Reconnect before applying.';if(scenario==='conflict'){message='Configuration changed elsewhere. Review the conflict before rebasing your draft.';action='<button data-action="rebase">Review conflict</button>'}if(scenario==='unavailable')message='Display preview is unavailable. You can keep editing, but display changes cannot be applied.';if(scenario==='unknown'){message='The operation outcome is unknown. Refresh its receipt before attempting another save.';action='<button data-action="refresh">Refresh receipt</button>'}if(feedback==='failed')message='Apply failed. Nothing was saved in this demo; your draft is retained.';if(movePending)message='Rule order changed. Apply or Discard this move before making other edits.';const errors=problems();if(errors.length)message=errors.join(' ');$('#banner').hidden=!message;$('#banner').innerHTML=esc(message)+action;updatePreviews();}
function updatePreviews(){if(page==='appearance'){$('#mini-focused').style.borderWidth=draft.appearance.border+'px';$('#mini-focused').style.borderColor=draft.appearance.focused;$('#mini-normal').style.borderColor=draft.appearance.normal;$('#mini-focused').style.opacity=draft.appearance.opacityEnabled?draft.appearance.opacity:1;$('#appearance-caption').textContent=`${draft.appearance.border}px border · ${draft.appearance.blur?'Blur on':'Blur off'}`;$$('input[type=color]').forEach(i=>{const out=$('#'+i.id+'-value');if(out)out.textContent=i.value})}if(page==='layouts'){$('#layout-preview').dataset.layout=draft.layouts.default;$('#layout-preview').style.gap=Math.min(draft.layouts.inner,24)+'px'}if(page==='displays'){const map=$('#screen-map');map.dataset.position=draft.displays.position;map.style.alignItems=['above','below'].includes(draft.displays.position)?({top:'flex-start',center:'center',bottom:'flex-end'}[draft.displays.align]):({top:'flex-start',center:'center',bottom:'flex-end'}[draft.displays.align]);$('#position-summary').textContent=`Display 2 is ${draft.displays.position==='above'?'above':draft.displays.position==='below'?'below':'to the '+draft.displays.position+' of'} display 1. Alignment: ${draft.displays.align}.`;}}
function toast(message){$('#toast').textContent=message;$('#toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').hidden=true,3500)}
function openModal(kind,title,body,actions){opener=document.activeElement;modalKind=kind;$('#dialog').innerHTML=`<div class="dialog-body"><h2 id="dialog-title">${title}</h2>${body}</div><div class="dialog-actions">${actions}</div>`;if(!$('#dialog').open)$('#dialog').showModal();}

function commit(){baseline=clone(draft);movePending=false;invalid.clear();feedback='saved';closeModal();render();toast('Saved in this demo. Your actual settings are unchanged.');}
function beginPreview(){deadline=Date.now()+15000;openModal('preview','Keep this display arrangement?',`<p>This is a simulated display preview. Keep saves the entire reviewed Aqueous draft.</p><div class="countdown" id="countdown">15</div><p>Seconds until automatic revert</p><div class="progress"><span id="countdown-progress" style="width:100%"></span></div><p>Revert or Escape restores the saved arrangement and retains your edits.</p>`,`<button data-action="revert">Revert</button><button class="primary" data-action="keep">Keep changes</button>`);previewTimer=setInterval(()=>{const remain=Math.max(0,deadline-Date.now());if(remain===0){revertPreview('Preview timed out. Your draft is retained.');return}$('#countdown').textContent=Math.ceil(remain/1000);$('#countdown-progress').style.width=(remain/150)+'%'},100)}
function revertPreview(message='Preview reverted. Your draft is retained.'){closeModal();toast(message);update()}
function discard(){openModal('discard','Discard Aqueous changes?',`<p>This restores the saved sample values in all affected sections.</p><div class="review-section">${changedGroups().map(g=>`<p>${pages[g][0]}</p>`).join('')}</div><p class="hint">An unknown operation outcome remains unresolved even after discarding.</p>`,`<button data-action="cancel">Keep editing</button><button class="primary" data-action="confirm-discard">Discard changes</button>`)}
function editRule(id){const existing=draft.rules.items.find(r=>r.id===id),r=existing||{app:'',title:'',floating:'On',workspace:''};openModal('rule',existing?'Edit window rule':'Add window rule',`<p>All conditions must match. Saving stages this rule in the shared draft.</p><form id="rule-form"><label>Application ID pattern<input name="app" required value="${esc(r.app)}" placeholder="e.g. firefox"></label><label>Window title pattern <small>Optional additional condition</small><input name="title" value="${esc(r.title)}" placeholder="e.g. *Picture-in-Picture*"></label><label>Floating<select name="floating">${optionList(['Inherit','On','Off'],r.floating)}</select></label><label>Workspace <small>Leave empty to inherit</small><input name="workspace" type="number" min="1" max="99" value="${esc(r.workspace)}"></label><div class="error" id="rule-error" role="alert"></div></form>`,`${existing?`<button data-action="delete-rule" data-id="${id}" style="margin-right:auto">Delete rule</button>`:''}<button data-action="cancel">Cancel</button><button class="primary" data-action="save-rule" data-id="${id||''}">Save rule to draft</button>`);}
function editShortcut(id){const b=draft.keybinds.custom.find(x=>x.id===id)||{chord:'',command:''};openModal('shortcut',id?'Edit custom shortcut':'Add custom shortcut',`<p>Editing a command never executes it.</p><form id="shortcut-form"><label>Shortcut chord<input name="chord" required value="${esc(b.chord)}" placeholder="Super+E"></label><label>Compositor command<input name="command" required value="${esc(b.command)}" placeholder="spawn:nemo"></label><p class="hint">Use spawn:, launch:, set_layout: or builtin: syntax.</p><div class="error" id="shortcut-error" role="alert"></div></form>`,`<button data-action="cancel">Cancel</button><button class="primary" data-action="save-shortcut" data-id="${id||''}">Save shortcut to draft</button>`)}
function rebase(){openModal('conflict','Review configuration conflict',`<p>The sample keyboard layout changed outside Settings.</p><section class="review-section"><p>Last observed: us</p><p>External sample: de</p><p>Your draft: ${esc(draft.input.keyboard)}</p></section><p>Choose which value to retain. Other draft edits are preserved. This resolves only the simulated conflict.</p>`,`<button data-action="cancel">Continue editing</button><button data-action="use-external">Use external value</button><button class="primary" data-action="use-local">Keep my draft</button>`)}
function reset(){if($('#dialog').open)closeModal();draft=clone(defaults);baseline=clone(defaults);movePending=false;invalid.clear();feedback='';scenario='ready';$('#scenario').value='ready';search='';selectedScreen=1;Object.keys(disclosureState).forEach(k=>delete disclosureState[k]);Object.keys(scrollPositions).forEach(k=>delete scrollPositions[k]);render();toast('Sample configuration reset.');}
function action(name,b){switch(name){case 'cancel':if(modalKind==='preview')revertPreview();else closeModal();break;case 'confirm-apply':if(blocked())return;if(scenario==='failure'){feedback='failed';closeModal();update();return}if(groupDirty('displays'))beginPreview();else commit();break;case 'keep':if(modalKind==='preview'&&Date.now()<deadline)commit();else revertPreview();break;case 'revert':revertPreview();break;case 'confirm-discard':draft=clone(baseline);movePending=false;invalid.clear();feedback='';closeModal();render();toast('Shared Aqueous draft discarded.');break;
case 'identify':$('#screen-map').classList.add('identifying');setTimeout(()=>$('#screen-map')?.classList.remove('identifying'),2200);toast('Screens identified in the sample diagram.');break;
case 'select-screen':selectedScreen=Number(b.dataset.index);scrollPositions[page]=$('#body').scrollTop;render();break;
case 'hdr-auto':draft.displays.hdrLevel='Automatic';draft.displays.sdrLevel='Automatic';render();break;
case 'add-rule':editRule();break;case 'edit-rule':editRule(b.dataset.id);break;case 'delete-rule':draft.rules.items=draft.rules.items.filter(r=>r.id!==b.dataset.id);closeModal();render();break;
case 'save-rule':{const f=$('#rule-form');if(!f.reportValidity())return;const data=new FormData(f);if(!data.get('app').trim()){$('#rule-error').textContent='Enter an application ID pattern.';return}if(data.get('floating')==='Inherit'&&!data.get('workspace')){$('#rule-error').textContent='Add at least one setting to this guided rule.';return}const id=b.dataset.id||'r'+(++sequence+2),r={id,app:data.get('app'),title:data.get('title'),floating:data.get('floating'),workspace:data.get('workspace')};const index=draft.rules.items.findIndex(x=>x.id===id);if(index<0)draft.rules.items.push(r);else draft.rules.items[index]=r;closeModal();render();toast('Rule staged in the shared draft.');break}
case 'move-rule':{if(changedGroups().length)return;const i=Number(b.dataset.index),j=i+Number(b.dataset.direction);[draft.rules.items[i],draft.rules.items[j]]=[draft.rules.items[j],draft.rules.items[i]];movePending=true;render();$('#apply').focus();break}
case 'add-shortcut':editShortcut();break;case 'edit-shortcut':editShortcut(b.dataset.id);break;case 'delete-shortcut':draft.keybinds.custom=draft.keybinds.custom.filter(x=>x.id!==b.dataset.id);render();break;
case 'save-shortcut':{const f=$('#shortcut-form');if(!f.reportValidity())return;const data=new FormData(f),chord=data.get('chord').trim(),command=data.get('command').trim();if(!chord||!/^(spawn:|launch:|set_layout:|builtin:).+/.test(command)){$('#shortcut-error').textContent='Enter a chord and a command with a supported prefix.';return}const id=b.dataset.id||'c'+(++sequence+1),item={id,chord,command},i=draft.keybinds.custom.findIndex(x=>x.id===id);if(i<0)draft.keybinds.custom.push(item);else draft.keybinds.custom[i]=item;closeModal();render();break}
case 'validate':toast(problems()[0]||'Sample controls are valid. Production uses canonical helper validation.');break;
case 'refresh':toast(scenario==='unknown'?'Receipt still unknown in this scenario. Further saves remain blocked.':'Sample status refreshed. Your draft is retained.');break;
case 'rebase':rebase();break;case 'use-external':case 'use-local':baseline.input.keyboard='de';if(name==='use-external')draft.input.keyboard='de';scenario='ready';$('#scenario').value='ready';closeModal();render();toast('Sample conflict resolved. Review the retained draft before applying.');break;}}
document.addEventListener('click',e=>{const link=e.target.closest('[data-page]');if(link){navigate(link.dataset.page);return}const b=e.target.closest('[data-action]');if(b&&!b.disabled)action(b.dataset.action,b)});
function onField(e){const t=e.target;if(t.id==='shortcut-search'){search=t.value;$('#shortcut-list').innerHTML=shortcutList();return}if(!t.dataset.field||t.disabled)return;const path=t.dataset.field;if(movePending)return;if(t.type==='radio'&&!t.checked)return;if(t.type==='number'&&!t.checkValidity()){invalid.set(path,'Enter a valid value for '+(fieldNames[path]||path)+'.');t.classList.add('invalid');update();return}invalid.delete(path);t.classList.remove('invalid');let value=t.type==='checkbox'?t.checked:t.type==='number'?Number(t.value):t.value;if(t.required&&!String(value).trim())invalid.set(path,'Enter a value for '+(fieldNames[path]||path)+'.');if(path.startsWith('displays.screens.')&&path.endsWith('.enabled')&&!value&&draft.displays.screens.filter(x=>x.enabled).length===1){t.checked=true;toast('Keep at least one display enabled.');return}if(path==='advanced.source'){draft.advanced.source=value;document.querySelector("label[for=raw-text]").textContent="Raw TOML · "+value;toast('Source label selected. This prototype uses one raw text buffer.');return}set(path,value);feedback='';if(path==='advanced.request'){try{JSON.parse(value);invalid.delete(path)}catch{invalid.set(path,'The draft request is not valid JSON. Your text is retained.')}}if(path.startsWith('displays.screens.')&&path.endsWith('.enabled')){scrollPositions[page]=$('#body').scrollTop;render()}else update();}
document.addEventListener('input',onField);document.addEventListener('change',e=>{if(e.target.matches('select'))onField(e)});
document.addEventListener('toggle',e=>{if(e.target.matches('details[data-disclosure]'))disclosureState[e.target.dataset.disclosure]=e.target.open},true);
document.addEventListener('submit',e=>{if(e.target.id==='rule-form'||e.target.id==='shortcut-form'){e.preventDefault();const button=$('#dialog [data-action^="save-"]');button.click()}});
$('#apply').onclick=review;$('#discard').onclick=discard;$('#reset').onclick=reset;
$('#theme').onclick=()=>{const light=document.body.classList.toggle('light');$('#theme').textContent=light?'Dark preview':'Light preview'};
$('#scenario').onchange=e=>{scenario=e.target.value;feedback='';update()};
$('#sections').onclick=()=>{const open=$('#navigation').classList.toggle('open');$('#scrim').classList.toggle('open',open);$('#sections').setAttribute('aria-expanded',String(open));if(open)$('#navigation [aria-current=page]').focus()};$('#scrim').onclick=closeNav;
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#dialog').open)closeNav()});$('#dialog').addEventListener('cancel',e=>{e.preventDefault();if(modalKind==='preview')revertPreview();else closeModal()});
const params=new URLSearchParams(location.search);if(params.get('theme')==='light')$('#theme').click();if(pages[location.hash.slice(1)])page=location.hash.slice(1);if([...$('#scenario').options].some(o=>o.value===params.get('state'))){scenario=params.get('state');$('#scenario').value=scenario}render();
</script>
</body></html>
